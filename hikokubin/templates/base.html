<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}秘匿便{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='theme.css') }}"></head><body>
<header><a class="brand" href="{{ url_for('index') }}"><span>✉</span> 秘匿便</a>{% if session.user %}<nav><span>{{ session.user.name }}</span><a href="{{ url_for('logout') }}">ログアウト</a></nav>{% endif %}</header>
<main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
</body></html>
