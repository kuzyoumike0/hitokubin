{% extends 'base.html' %}{% block title %}HO作成｜秘匿便{% endblock %}{% block content %}<div class="formwrap"><p class="eyebrow">SECRET HANDOUT</p><h1>{% if handout %}HOを編集{% else %}新しいHO{% endif %}</h1><form method="post" class="editor"><label>シナリオ名<input name="scenario" required value="{{ handout.scenario if handout else '' }}" placeholder="例：薔薇庭女学院"></label><div class="twocol"><label>HO名<input name="name" required value="{{ handout.name if handout else '' }}" placeholder="例：守り手"></label><label>PL表示名（任意）<input name="recipient_name" value="{{ handout.recipient_name if handout else '' }}" placeholder="確認画面に表示"></label></div><label>DiscordユーザーID<input name="recipient_id" inputmode="numeric" required value="{{ handout.recipient_id if handout else '' }}" placeholder="18～19桁の数字"></label><label>秘匿本文<textarea name="body" required rows="14" placeholder="このHOだけが知っている情報を入力します。">{{ handout.body if handout else '' }}</textarea></label><div class="formactions"><a href="{{ url_for('dashboard') }}">戻る</a><button class="primary">保存する</button></div></form></div>{% endblock %}
